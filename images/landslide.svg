<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t">
  <title id="t">ひび割れや落石、湧き水、傾いた木が見られる斜面と、斜面から離れて避難する家族のイラスト</title>
  <defs><clipPath id="f"><rect width="600" height="340" rx="28"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="600" height="340" fill="#e2ecf6"/>
    <g fill="#c8d8ea"><ellipse cx="420" cy="50" rx="120" ry="30"/></g>
    <!-- slope -->
    <path d="M0 40 C90 60 180 150 300 290 V340 H0z" fill="#8a6d4d"/>
    <path d="M0 40 C90 60 180 150 300 290" stroke="#5f9c74" stroke-width="14" fill="none"/>
    <!-- cracks -->
    <g stroke="#3d2b1c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 110 l14 10 l-6 14 l14 10"/><path d="M150 170 l10 12 l-8 10 l12 12"/>
    </g>
    <!-- water spring -->
    <g fill="#6ea6db"><path d="M190 222 q10 18 30 22 q-20 6 -34 -4z"/><circle cx="226" cy="252" r="5"/><circle cx="238" cy="264" r="4"/></g>
    <!-- tilting tree -->
    <g transform="translate(110,92) rotate(22)">
      <rect x="-5" y="-60" width="10" height="60" fill="#6b4a2b"/>
      <circle cx="0" cy="-74" r="26" fill="#3f7a5c"/>
    </g>
    <!-- falling rocks -->
    <g fill="#6b6b6b"><circle cx="232" cy="190" r="10"/><circle cx="258" cy="222" r="7"/><circle cx="270" cy="170" r="6"/></g>
    <g stroke="#6b6b6b" stroke-width="3" stroke-linecap="round"><path d="M218 176 l-8 -8M246 208 l-6 -6"/></g>
    <!-- ground -->
    <rect x="0" y="290" width="600" height="50" fill="#6aa37f"/>
    <!-- house near slope -->
    <g transform="translate(300,236)">
      <rect x="0" y="16" width="70" height="48" fill="#f7f2e8"/><path d="M-6 20 L35 -8 L76 20z" fill="#1d3a70"/>
      <rect x="26" y="34" width="16" height="30" fill="#9a6843"/>
    </g>
    <!-- family moving away -->
    <path d="M410 250 h90" stroke="#1e6fd9" stroke-width="8" stroke-linecap="round"/>
    <path d="M492 236 l20 14 l-20 14z" fill="#1e6fd9"/>
    <g transform="translate(470,318) scale(.72)">
      <rect x="-11" y="-40" width="9" height="40" rx="4" fill="#2d3e5e"/><rect x="2" y="-40" width="9" height="40" rx="4" fill="#2d3e5e"/>
      <rect x="-17" y="-88" width="34" height="52" rx="12" fill="#2f5fa8"/>
      <circle cy="-104" r="15" fill="#f2c49b"/>
      <path d="M-15 -106 a15 15 0 0 1 30 0 q-7 -7 -15 -5 q-8 -2 -15 5z" fill="#2e211a"/>
    </g>
    <g transform="translate(520,318) scale(.66)">
      <path d="M26 -58 v58" stroke="#7a5230" stroke-width="4" stroke-linecap="round"/>
      <rect x="-11" y="-40" width="9" height="40" rx="4" fill="#4b4b5e"/><rect x="2" y="-40" width="9" height="40" rx="4" fill="#4b4b5e"/>
      <rect x="-17" y="-86" width="34" height="52" rx="12" fill="#b07aa1"/>
      <circle cy="-120" r="8" fill="#cfcfcf"/><circle cy="-102" r="15" fill="#f0cfb0"/>
      <path d="M-15 -104 a15 15 0 0 1 30 0 q-15 -6 -30 0z" fill="#d7d7d7"/>
    </g>
  </g>
</svg>
