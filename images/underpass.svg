<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="t">
  <title id="t">線路の下をくぐるアンダーパスが冠水し、手前で車が止まって引き返す様子のイラスト。冠水部分には進入禁止の赤い×印</title>
  <defs><clipPath id="f"><rect width="600" height="360" rx="28"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="600" height="360" fill="#34507e"/>
    <g stroke="#9ab8d8" stroke-width="3" stroke-linecap="round" opacity=".7">
      <path d="M40 30l-8 16M110 50l-8 16M180 24l-8 16M260 44l-8 16M340 28l-8 16M420 48l-8 16M500 26l-8 16M570 44l-8 16M70 90l-8 16M480 94l-8 16"/>
    </g>
    <!-- railway bridge -->
    <rect x="170" y="112" width="260" height="30" fill="#8b98ab"/>
    <rect x="170" y="104" width="260" height="10" fill="#5d6b80"/>
    <rect x="180" y="142" width="26" height="110" fill="#6f7c90"/><rect x="394" y="142" width="26" height="110" fill="#6f7c90"/>
    <!-- train -->
    <g transform="translate(220,62)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#e8eef6"/>
      <rect x="0" y="28" width="160" height="6" fill="#1e6fd9"/>
      <g fill="#34507e"><rect x="14" y="8" width="24" height="14" rx="3"/><rect x="50" y="8" width="24" height="14" rx="3"/><rect x="86" y="8" width="24" height="14" rx="3"/><rect x="122" y="8" width="24" height="14" rx="3"/></g>
    </g>
    <!-- road dipping -->
    <path d="M0 250 H120 C170 250 190 318 300 318 S430 250 480 250 H600 V360 H0z" fill="#4a4f5a"/>
    <!-- flood water in dip -->
    <path d="M150 262 C190 262 210 318 300 318 S410 262 450 262z" fill="#6ea6db" opacity=".9"/>
    <path d="M150 262 H450" stroke="#bfe0ff" stroke-width="4"/>
    <g stroke="#dcefff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M230 280 q12 -8 24 0 t24 0"/><path d="M320 286 q12 -8 24 0 t24 0"/></g>
    <!-- submerged car roof -->
    <path d="M270 276 l10 -14 h40 l10 14z" fill="#9aa4b4" opacity=".75"/>
    <!-- big red X -->
    <g stroke="#e0203a" stroke-width="16" stroke-linecap="round">
      <path d="M250 180 L350 280"/><path d="M350 180 L250 280"/>
    </g>
    <!-- stopped car on left -->
    <g transform="translate(60,250)">
      <path d="M-40 0 v-14 l10 -16 h46 l14 16 h10 v14z" fill="#f7f2e8"/>
      <rect x="-24" y="-27" width="16" height="12" fill="#bcd6f0"/><rect x="-4" y="-27" width="16" height="12" fill="#bcd6f0"/>
      <circle cx="-22" cy="2" r="8" fill="#222"/><circle cx="20" cy="2" r="8" fill="#222"/>
      <rect x="28" y="-12" width="8" height="6" fill="#ffd23f"/>
    </g>
    <!-- U-turn arrow -->
    <path d="M110 200 q20 -40 -30 -40 h-40" stroke="#ffd23f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M44 146 l-22 14 l22 14z" fill="#ffd23f"/>
    <!-- road sign -->
    <g transform="translate(520,160)">
      <rect x="-4" y="30" width="8" height="60" fill="#ccc"/>
      <circle r="34" fill="#fff"/><circle r="30" fill="#e0203a"/>
      <rect x="-20" y="-6" width="40" height="12" fill="#fff"/>
    </g>
  </g>
</svg>
