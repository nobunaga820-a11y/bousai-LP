<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t">
  <title id="t">祖父母・両親・子どもの家族がテーブルを囲み、地図を見ながら避難場所を話し合うイラスト</title>
  <defs><clipPath id="f"><rect width="600" height="340" rx="28"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="600" height="340" fill="#fff6e3"/>
    <rect x="0" y="0" width="600" height="200" fill="#eaf3fc"/>
