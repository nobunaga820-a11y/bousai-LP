      <circle cx="-6" cy="-66" r="2" fill="#333"/><circle cx="6" cy="-66" r="2" fill="#333"/>
      <path d="M-6 -58 q6 5 12 0" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
