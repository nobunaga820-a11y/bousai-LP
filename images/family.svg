      <path d="M90 58 l14 20 l6 -20z" fill="#fff" stroke="#1d3a70" stroke-width="3" stroke-linejoin="round"/>
      <rect x="92" y="54" width="16" height="6" fill="#fff"/>
      <text x="105" y="37" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1d3a70">避難場所はここだね</text>
    </g>
    <!-- people behind table -->
