    <rect x="440" y="30" width="120" height="90" rx="8" fill="#bfdcf5" stroke="#fff" stroke-width="6"/>
    <path d="M500 30 v90 M440 75 h120" stroke="#fff" stroke-width="4"/>
    <!-- speech bubble -->
    <g transform="translate(40,26)">
