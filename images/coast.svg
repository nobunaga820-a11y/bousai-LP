<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t">
  <title id="t">高い波が寄せる海と低い土地の住宅、高い場所へ移動する車と人のイラスト</title>
  <defs><clipPath id="f"><rect width="600" height="340" rx="28"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="600" height="340" fill="#d5e5f5"/>
    <g fill="#b8cde6"><ellipse cx="150" cy="46" rx="110" ry="28"/><ellipse cx="450" cy="56" rx="90" ry="24"/></g>
    <!-- hill on right -->
    <path d="M300 340 L520 110 H600 V340z" fill="#5f9c74"/>
    <path d="M520 110 H600 V130 H520z" fill="#4c8a6a"/>
    <!-- low land -->
    <rect x="0" y="230" width="360" height="110" fill="#8fbf94"/>
    <!-- sea on left -->
    <path d="M0 170 C40 150 70 190 110 170 S170 150 200 180 V340 H0z" fill="#2f6fb5"/>
    <g stroke="#e9f3ff" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M10 196 q20 -14 40 0 t40 0"/><path d="M40 240 q20 -14 40 0 t40 0"/><path d="M110 200 q20 -14 40 0 t40 0"/>
    </g>
    <!-- houses low land -->
    <g transform="translate(220,190)">
      <rect x="0" y="20" width="60" height="42" fill="#f7f2e8"/><path d="M-6 24 L30 -4 L66 24z" fill="#1d3a70"/>
      <rect x="22" y="36" width="14" height="26" fill="#9a6843"/>
    </g>
    <!-- flooding water on low land -->
    <rect x="200" y="244" width="130" height="14" rx="7" fill="#6ea6db" opacity=".8"/>
    <!-- car on hill (moved early) -->
    <g transform="translate(528,96)">
      <path d="M-34 0 v-12 l8 -14 h40 l12 14 h8 v12z" fill="#f28c28"/>
      <rect x="-20" y="-24" width="14" height="10" fill="#dbeaf8"/><rect x="-2" y="-24" width="14" height="10" fill="#dbeaf8"/>
      <circle cx="-20" cy="2" r="7" fill="#333"/><circle cx="18" cy="2" r="7" fill="#333"/>
    </g>
    <!-- arrow up to hill -->
    <path d="M330 280 L450 160" stroke="#ffd23f" stroke-width="10" stroke-linecap="round"/>
    <path d="M430 150 L466 142 L458 178z" fill="#ffd23f"/>
    <!-- person with child walking up -->
    <g transform="translate(410,248) scale(.75)">
      <rect x="-11" y="-40" width="9" height="40" rx="4" fill="#3a3a52"/><rect x="2" y="-40" width="9" height="40" rx="4" fill="#3a3a52"/>
      <rect x="-17" y="-88" width="34" height="52" rx="12" fill="#e86a7a"/>
      <path d="M-18 -110 a18 18 0 0 1 36 0 v22 h-7 v-16 h-22 v16 h-7z" fill="#5a3825"/>
      <circle cy="-104" r="15" fill="#f5d0ad"/>
      <path d="M-15 -108 a15 15 0 0 1 30 0 q-10 -4 -17 -10 q-4 8 -13 10z" fill="#5a3825"/>
    </g>
    <g transform="translate(440,252) scale(.5)">
      <rect x="-11" y="-40" width="9" height="40" rx="4" fill="#1d3a70"/><rect x="2" y="-40" width="9" height="40" rx="4" fill="#1d3a70"/>
      <path d="M-22 -36 L-16 -90 h32 L22 -36z" fill="#ffc62b"/>
      <circle cy="-104" r="20" fill="#ffc62b"/><circle cy="-102" r="14" fill="#f5cfa9"/>
    </g>
  </g>
</svg>
